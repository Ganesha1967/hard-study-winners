<div class="flex border-b border-white/10 gap-6 text-xs md:text-sm font-bold uppercase tracking-wider pb-3">
  <button onclick="showMarathonSubTab('active')" id="sub-btn-active" class="sub-tab-active text-white cursor-pointer relative" aria-selected="true">
    Активные марафоны
  </button>
  <button onclick="showMarathonSubTab('archive')" id="sub-btn-archive" class="text-white/50 hover:text-white transition-all cursor-pointer relative" aria-selected="false">
    Архив
  </button>
</div>

<div id="marathon-active" class="space-y-8 md:space-y-12 mt-8 md:mt-12">
  <div class="glass-card p-8 md:p-12 relative overflow-hidden border border-white/10 text-center">
    <div class="absolute top-0 right-0 w-64 h-64 bg-purple-600/10 blur-[100px] rounded-full -mr-32 -mt-32"></div>
    <div class="relative z-10 space-y-4">
      <h2 class="text-3xl md:text-5xl font-bold text-white/40 tracking-tighter uppercase leading-none">
        Активных марафонов нет
      </h2>
      <p class="text-sm md:text-base text-white/30 font-mono max-w-lg mx-auto">
        Следите за новостями в тг-группе, чтобы не пропустить следующий забег!
      </p>
      <a href="https://t.me/hardstudywinners" target="_blank" class="inline-block mt-4 action-btn px-8 py-3 rounded-xl text-sm font-bold no-underline">
        <i class="fab fa-telegram-plane mr-2"></i> Перейти в тг
      </a>
    </div>
  </div>
</div>

<div id="marathon-archive" class="hidden space-y-6 mt-8 md:mt-12">
  <div id="archive-placeholder" class="text-white/60 text-sm font-mono animate-pulse text-center py-8">
    <i class="fas fa-spinner fa-spin mr-2"></i> Загрузка архива марафонов...
  </div>
</div>
